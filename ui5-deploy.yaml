specVersion: '3.0'
metadata:
  name: com.alk.pmregistration
type: application
framework:
  name: SAPUI5
  version: "1.120.12"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - /test/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: #<URL del sistema ABAP, ej: https://my-system.example.com>
          destination: DES_BW_ALK
          scp: true
        app:
          name: #<BSP application name, ej: ZPMREGISTRATION>
          package: #<paquete ABAP, ej: ZITS_PM>
          transport: #<orden de transporte, ej: ALK K900001>
        credentials:
          username: env:ABAP_USER
          password: env:ABAP_PASSWORD
